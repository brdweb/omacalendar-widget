name: Release candidate

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  current-omarchy-gate:
    name: Current Omarchy release gate
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install current Arch and Quickshell test runtime
        run: |
          pacman -Syu --noconfirm --needed \
            git jq python quickshell qt6-declarative \
            tesseract tesseract-data-eng weston
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch release-reference Omarchy
        run: |
          omarchy_root="$RUNNER_TEMP/omacalendar-omarchy"
          git init "$omarchy_root"
          git -C "$omarchy_root" remote add origin https://github.com/omacom/omarchy.git
          git -C "$omarchy_root" fetch --depth=1 origin \
            346e69e1cec6c4e8924531874af6ba010a1bc99e
          git -C "$omarchy_root" checkout --detach FETCH_HEAD
      - name: Run the complete widget integration suite
        run: |
          export OMARCHY_PATH="$RUNNER_TEMP/omacalendar-omarchy"
          export PATH="$OMARCHY_PATH/bin:$PATH"
          ./tests/run-headless-omarchy.sh

  draft-release:
    name: Verify, package, attest, and draft
    needs: current-omarchy-gate
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install current Arch release dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git github-cli jq python qt6-declarative \
            tesseract tesseract-data-eng
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Trust the container checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Verify signed tag and paired release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object=$(git rev-parse "${GITHUB_REF_NAME}^{tag}")
          verified=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
            --jq '.verification.verified')
          if [[ ${verified} != true ]]; then
            echo "GitHub did not verify the annotated tag signature" >&2
            exit 1
          fi
          ./scripts/release/verify-release.sh "${GITHUB_REF_NAME}"

      - name: Verify the qualified published OmaCalendar app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/verify-qualified-app.py

      - name: Run portable contracts
        run: ./tests/run-portable.sh

      - name: Create and verify deterministic source archive
        id: package
        run: |
          mkdir -p artifacts stage
          ./scripts/release/package-source.sh "${GITHUB_REF_NAME}" artifacts
          version=${GITHUB_REF_NAME#v}
          archive="omacalendar-widget-${version}-source.tar.gz"
          tar -xzf "artifacts/${archive}" -C stage
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "archive=${archive}" >>"${GITHUB_OUTPUT}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: stage
          format: spdx-json
          output-file: artifacts/omacalendar-widget-${{ steps.package.outputs.version }}.spdx.json
          artifact-name: omacalendar-widget-${{ steps.package.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write and verify checksums
        working-directory: artifacts
        run: |
          LC_ALL=C sha256sum \
            "${{ steps.package.outputs.archive }}" \
            "omacalendar-widget-${{ steps.package.outputs.version }}.spdx.json" \
            >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest source provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/${{ steps.package.outputs.archive }}
            artifacts/SHA256SUMS

      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/${{ steps.package.outputs.archive }}
          sbom-path: artifacts/omacalendar-widget-${{ steps.package.outputs.version }}.spdx.json

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: omacalendar-widget-${{ steps.package.outputs.version }}-release-candidate
          path: artifacts/
          if-no-files-found: error

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          existing_state=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [[ ${existing_state} == true ]]; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
            if [[ ${RELEASE_VERSION} == *-* ]]; then
              gh release edit "${GITHUB_REF_NAME}" --prerelease
            fi
          elif [[ ${existing_state} == false ]]; then
            echo "refusing to replace assets on an already published release" >&2
            exit 1
          else
            release_flags=(--draft --generate-notes --verify-tag)
            if [[ ${RELEASE_VERSION} == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              "${release_flags[@]}" \
              --title "OmaCalendar widget ${RELEASE_VERSION}"
          fi
