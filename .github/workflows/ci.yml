name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-omarchy:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install current Arch and Quickshell test runtime
        run: |
          pacman -Syu --noconfirm --needed \
            git jq python quickshell qt6-declarative ruby shellcheck weston
      - uses: actions/checkout@v4
      - name: Fetch release-reference Omarchy
        run: |
          omarchy_root="$RUNNER_TEMP/omacalendar-omarchy"
          git init "$omarchy_root"
          git -C "$omarchy_root" remote add origin https://github.com/omacom/omarchy.git
          git -C "$omarchy_root" fetch --depth=1 origin \
            13f18b2cb7286fb54f87daf571a031aa6af3d8f0
          git -C "$omarchy_root" checkout --detach FETCH_HEAD
      - name: Run current-Omarchy integration suite
        run: |
          export OMARCHY_PATH="$RUNNER_TEMP/omacalendar-omarchy"
          export PATH="$OMARCHY_PATH/bin:$PATH"
          ./tests/run-headless-omarchy.sh
      - name: Check shell scripts and workflow syntax
        run: |
          shellcheck tests/*.sh scripts/release/*.sh
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/*.yml
          git diff --check
