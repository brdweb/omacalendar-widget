name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-omarchy:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Check out release-reference Omarchy
        uses: actions/checkout@v4
        with:
          repository: omacom/omarchy
          ref: 13f18b2cb7286fb54f87daf571a031aa6af3d8f0
          path: omarchy
      - name: Install current Arch and Quickshell test runtime
        run: |
          pacman -Syu --noconfirm --needed \
            git jq python quickshell qt6-declarative ruby shellcheck
      - name: Run current-Omarchy integration suite
        run: |
          export OMARCHY_PATH="$PWD/omarchy"
          export PATH="$OMARCHY_PATH/bin:$PATH"
          ./tests/run.sh
      - name: Check shell scripts and workflow syntax
        run: |
          shellcheck tests/*.sh scripts/release/*.sh
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/*.yml
          git diff --check
